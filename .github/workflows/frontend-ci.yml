name: frontend-ci

on:
  push:
    branches: [fe, be, dev, main]
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  pull_request:
    branches: [main, dev]
    paths:
      - frontend/**

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      # Nilai dummy untuk build CI; bukan secret. Backend tidak dipanggil di test
      # (fetch di-stub per test).
      VITE_API_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # Vitest default butuh worker; CI tanpa TTY lebih stabil dengan worker tunggal.
      - run: npm test -- --pool=forks --maxWorkers=1
      - run: npm run build
